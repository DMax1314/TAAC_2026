name: taac2026

x-gpu-env: &gpu-env
  TAAC_SKIP_UV_SYNC: "1"

x-gpu-service: &gpu-service
  build:
    context: .
    dockerfile: docker/Dockerfile
  ipc: host
  init: true
  gpus: all
  volumes:
    - hf-cache:/root/.cache/huggingface
    - uv-cache:/root/.cache/uv
    - train-outputs:/workspace/outputs
  tmpfs:
    - /tmp

services:
  dev:
    <<: *gpu-service
    profiles: [dev]
    stdin_open: true
    tty: true
    environment:
      <<: *gpu-env
      AUTO_SYNC: ${AUTO_SYNC:-1}
    volumes:
      - .:/workspace
      - hf-cache:/root/.cache/huggingface
      - uv-cache:/root/.cache/uv
      - train-outputs:/workspace/outputs

  train:
    <<: *gpu-service
    profiles: [train]
    environment:
      <<: *gpu-env
      TRAIN_DATA_PATH: ${TRAIN_DATA_PATH:-}
      TAAC_SCHEMA_PATH: ${TAAC_SCHEMA_PATH:-}
      TAAC_EXPERIMENT: experiments/${EXPERIMENT:-baseline}
      TRAIN_ARGS: ${TRAIN_ARGS:-}
    command:
      - /bin/bash
      - -lc
      - >-
        bash run.sh train
        $${TRAIN_ARGS}

  evaluate:
    <<: *gpu-service
    profiles: [evaluate]
    environment:
      <<: *gpu-env
      TRAIN_DATA_PATH: ${TRAIN_DATA_PATH:-}
      TAAC_SCHEMA_PATH: ${TAAC_SCHEMA_PATH:-}
      TAAC_EXPERIMENT: experiments/${EXPERIMENT:-baseline}
      EVAL_ARGS: ${EVAL_ARGS:-}
    command:
      - /bin/bash
      - -lc
      - >-
        bash run.sh val
        $${EVAL_ARGS}

volumes:
  train-outputs:
    name: taac2026-train-outputs
  hf-cache:
    name: taac2026-hf-cache
  uv-cache:
    name: taac2026-uv-cache
