---
name: CI

"on":
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "experiments/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "experiments/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_CANONICAL_PYTHON_VERSION: "3.13"
  CPU_TEST_MARKERS: "(unit or contract or integration or benchmark_cpu) and not gpu and not benchmark_gpu"
  CPU_COMPAT_MARKERS: "(unit or contract) and not gpu and not benchmark_gpu"
  COVERAGE_SOURCE: "src/taac2026,experiments"
  COVERAGE_CRITICAL_RUNTIME: "src/taac2026/application/evaluation/*,src/taac2026/application/training/*,src/taac2026/infrastructure/checkpoints.py,src/taac2026/infrastructure/runtime/*"
  COVERAGE_CPU_SAFE_CORE: "src/taac2026/domain/*,src/taac2026/application/bootstrap/*,src/taac2026/application/evaluation/*,src/taac2026/application/experiments/*,src/taac2026/application/packaging/*,src/taac2026/application/training/*,src/taac2026/infrastructure/bundles/*,src/taac2026/infrastructure/checkpoints.py,src/taac2026/infrastructure/data/*,src/taac2026/infrastructure/experiments/*,src/taac2026/infrastructure/modeling/*,src/taac2026/infrastructure/runtime/*"
  COVERAGE_MODEL_EXPERIMENTS: "experiments/baseline/*,experiments/dualq/*,experiments/interformer/*,experiments/onetrans/*,experiments/queryformer/*,experiments/symbiosis/*,experiments/tokenformer/*"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 代码风格与策略
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.CI_CANONICAL_PYTHON_VERSION }}

      - name: 设置 uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: 同步开发工具环境
        run: uv sync --locked --extra dev --python "${{ env.CI_CANONICAL_PYTHON_VERSION }}"

      - name: 运行 Ruff 风格检查
        run: uv run --python "${{ env.CI_CANONICAL_PYTHON_VERSION }}" ruff check .

      - name: 运行 Vulture 死代码检查（仅警告）
        continue-on-error: true
        run: uv run --python "${{ env.CI_CANONICAL_PYTHON_VERSION }}" vulture --config pyproject.toml

  test:
    name: CPU 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 设置 uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: 同步项目环境
        run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"

      - name: 运行跨版本单元与契约测试
        if: matrix.python-version != env.CI_CANONICAL_PYTHON_VERSION
        run: uv run --python "${{ matrix.python-version }}" --with torch==2.13.0 pytest -m "${CPU_COMPAT_MARKERS}" -v

      - name: 运行完整 CPU 门禁并采集覆盖率
        if: matrix.python-version == env.CI_CANONICAL_PYTHON_VERSION
        run: >
          uv run --python "${{ matrix.python-version }}" --with torch==2.13.0 --with coverage coverage run
          --data-file=.coverage.cpu --source="${COVERAGE_SOURCE}"
          -m pytest -m "${CPU_TEST_MARKERS}" -v

      - name: 上传 CPU 覆盖率数据
        if: always() && matrix.python-version == env.CI_CANONICAL_PYTHON_VERSION
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cpu-data-py${{ env.CI_CANONICAL_PYTHON_VERSION }}
          path: .coverage.cpu
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: 覆盖率报告
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.CI_CANONICAL_PYTHON_VERSION }}

      - name: 设置 uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: 同步覆盖率工具环境
        run: uv sync --locked --extra dev --python "${{ env.CI_CANONICAL_PYTHON_VERSION }}"

      - name: 下载 CPU 覆盖率数据
        uses: actions/download-artifact@v8
        with:
          name: coverage-cpu-data-py${{ env.CI_CANONICAL_PYTHON_VERSION }}
          path: .coverage-artifacts/cpu

      - name: 恢复覆盖率数据
        run: cp .coverage-artifacts/cpu/.coverage.cpu .coverage

      - name: 总结覆盖率范围
        run: |
          {
            echo "## 覆盖率范围"
            echo
            echo "- Python 3.12 和 3.14 运行跨版本单元与契约测试: ${CPU_COMPAT_MARKERS}"
            echo "- Python ${CI_CANONICAL_PYTHON_VERSION} 运行完整 CPU 门禁: ${CPU_TEST_MARKERS}"
            echo "- 覆盖率采集 source: ${COVERAGE_SOURCE}"
            echo "- 关键训练 / 推理 runtime 门禁: 80%"
            echo "- CPU 安全核心门禁: 80%"
            echo "- PCVR 模型实验门禁: 75%"
            echo "- GPU / accelerator 行为仍需本地 CUDA 验证"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 门控关键训练与推理 runtime 覆盖率
        run: >
          uv run --python "${{ env.CI_CANONICAL_PYTHON_VERSION }}" coverage report --fail-under=80
          --include="${COVERAGE_CRITICAL_RUNTIME}"

      - name: 门控 CPU 安全核心覆盖率
        run: >
          uv run --python "${{ env.CI_CANONICAL_PYTHON_VERSION }}" coverage report --fail-under=80
          --include="${COVERAGE_CPU_SAFE_CORE}"

      - name: 门控 PCVR 模型实验覆盖率
        run: >
          uv run --python "${{ env.CI_CANONICAL_PYTHON_VERSION }}" coverage report --fail-under=75
          --include="${COVERAGE_MODEL_EXPERIMENTS}"

      - name: 导出全源码与实验覆盖率摘要（非门禁）
        if: always()
        run: >
          uv run --python "${{ env.CI_CANONICAL_PYTHON_VERSION }}" coverage report --fail-under=0
          --include="src/taac2026/*,experiments/*"

      - name: 导出 CPU 覆盖率 XML
        if: always()
        run: >
          uv run --python "${{ env.CI_CANONICAL_PYTHON_VERSION }}" coverage xml --fail-under=0
          -o coverage.xml

      - name: 上传覆盖率制品
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
